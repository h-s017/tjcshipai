name: Audit Shipai Blogger archive by month
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_shipai_months.py
      - name: Save audit report
        if: always()
        run: |
          if [ -f data/shipai-monthly-audit.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/shipai-monthly-audit.json
            git diff --cached --quiet || (git commit -m "Audit Shipai monthly archive" && git push)
          fi
