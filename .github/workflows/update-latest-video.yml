name: Update latest gathering video

on:
  workflow_dispatch:
  schedule:
    - cron: "15,45 13 * * 3,5"
    - cron: "25,55 3 * * 6"
    - cron: "25,55 6 * * 6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest YouTube video
        shell: bash
        run: |
          set -euo pipefail
          feed="$(curl -fsSL 'https://www.youtube.com/feeds/videos.xml?channel_id=UCk8zggAqSLPpgpTlR75Ju6w')"
          video_id="$(printf '%s' "$feed" | sed -n 's:.*<yt:videoId>\([^<]*\)</yt:videoId>.*:\1:p' | head -1)"
          test -n "$video_id"
          mkdir -p data
          printf '{\n  "videoId": "%s",\n  "updatedAt": "%s"\n}\n' "$video_id" "$(date -u +%FT%TZ)" > data/latest-video.json
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- data/latest-video.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-video.json
          git commit -m "Update latest gathering video"
          git push
