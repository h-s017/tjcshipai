<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="每日讀經心得：以聖經元素表瀏覽新舊約66卷、逐章閱讀與查找心得。"><title>每日讀經心得｜聖經元素表｜石牌教會</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#403f3b;background:#fbfaf7}*{box-sizing:border-box}body{margin:0}header{background:#574935;color:#fff;padding:17px max(18px,calc((100vw - 1020px)/2));display:flex;align-items:center;justify-content:space-between}header a{color:inherit;text-decoration:none;font-weight:600}header span{font-size:12px;letter-spacing:.12em;color:#e3d8c9}main{max-width:1020px;padding:36px 18px 90px;margin:auto}h1{text-align:center;font-size:clamp(27px,5vw,42px);font-weight:600;margin:0 0 8px}.intro{text-align:center;color:#777;line-height:1.7;margin:0 0 28px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.controls button,.back{border:1px solid #c9cfcc;background:white;color:#4c5e57;padding:11px 17px;border-radius:9px;cursor:pointer}.controls button.active{background:#586f67;color:white}.controls input{flex:1;min-width:150px;border:1px solid #c9cfcc;border-radius:9px;padding:11px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}.tile{border:0;aspect-ratio:1/1.06;border-radius:14px;color:white;padding:12px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 2px 4px #0000000a;transition:transform .15s}.tile:hover{transform:translateY(-3px)}.tile:focus-visible,.chapter:focus-visible{outline:3px solid #554735;outline-offset:3px}.tile .top{display:flex;justify-content:space-between;font-size:clamp(11px,2.5vw,15px);opacity:.95}.tile .center{text-align:center;font-size:clamp(25px,6vw,41px);font-weight:700;line-height:1.15}.tile .name{text-align:center;font-size:clamp(11px,2.9vw,15px)}.detail{margin-top:32px;border-top:1px solid #ddd;padding-top:25px}.detail h2{font-size:28px;margin:6px 0}.sub{color:#77817c;margin-bottom:20px}.chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}@media(min-width:700px){.chapters{grid-template-columns:repeat(10,1fr)}}.chapter{border:1px solid #cbd3d0;background:#fff;border-radius:8px;min-height:45px;font:inherit;cursor:pointer}.chapter.active{background:#596f67;color:#fff}.entry{background:#f0f2ef;border-radius:13px;margin-top:20px;padding:22px;line-height:1.7}.entry h3{margin:0 0 6px}.entry p{margin:7px 0}.muted{color:#6a7570}.hidden{display:none}footer{text-align:center;color:#85817b;font-size:13px;margin-top:44px}#books:empty:after{content:"查無符合的經卷";color:#777}
</style></head><body><header><a href="index.html">← 石牌教會</a><span>DAILY BIBLE REFLECTIONS</span></header><main><h1>聖經元素表</h1><p class="intro">每日讀經心得 · 66 BOOKS OF THE BIBLE<br>點選經卷，依章節探索讀經筆記</p><div class="controls"><button id="old" class="active" type="button">舊約 39 卷</button><button id="new" type="button">新約 27 卷</button><input id="search" aria-label="搜尋經卷" placeholder="搜尋經卷名稱或英文縮寫"></div><section id="books" class="grid" aria-label="聖經經卷元素表"></section><section id="detail" class="detail hidden" aria-live="polite"><button id="close" class="back" type="button">← 返回經卷</button><h2 id="booktitle"></h2><p id="meta" class="sub"></p><h3>選擇章節</h3><div id="chapters" class="chapters"></div><div id="entry" class="entry"></div></section><footer>真耶穌教會石牌教會 · 每日讀經心得</footer></main><script>
const books=[["創世記","創","GEN",50],["出埃及記","出","EXO",40],["利未記","利","LEV",27],["民數記","民","NUM",36],["申命記","申","DEU",34],["約書亞記","書","JOS",24],["士師記","士","JDG",21],["路得記","得","RUT",4],["撒母耳記上","撒上","1SA",31],["撒母耳記下","撒下","2SA",24],["列王紀上","王上","1KI",22],["列王紀下","王下","2KI",25],["歷代志上","代上","1CH",29],["歷代志下","代下","2CH",36],["以斯拉記","拉","EZR",10],["尼希米記","尼","NEH",13],["以斯帖記","斯","EST",10],["約伯記","伯","JOB",42],["詩篇","詩","PSA",150],["箴言","箴","PRO",31],["傳道書","傳","ECC",12],["雅歌","歌","SNG",8],["以賽亞書","賽","ISA",66],["耶利米書","耶","JER",52],["耶利米哀歌","哀","LAM",5],["以西結書","結","EZK",48],["但以理書","但","DAN",12],["何西阿書","何","HOS",14],["約珥書","珥","JOL",3],["阿摩司書","摩","AMO",9],["俄巴底亞書","俄","OBA",1],["約拿書","拿","JON",4],["彌迦書","彌","MIC",7],["那鴻書","鴻","NAM",3],["哈巴谷書","哈","HAB",3],["西番雅書","番","ZEP",3],["哈該書","該","HAG",2],["撒迦利亞書","亞","ZEC",14],["瑪拉基書","瑪","MAL",4],["馬太福音","太","MAT",28],["馬可福音","可","MRK",16],["路加福音","路","LUK",24],["約翰福音","約","JHN",21],["使徒行傳","徒","ACT",28],["羅馬書","羅","ROM",16],["哥林多前書","林前","1CO",16],["哥林多後書","林後","2CO",13],["加拉太書","加","GAL",6],["以弗所書","弗","EPH",6],["腓立比書","腓","PHP",4],["歌羅西書","西","COL",4],["帖撒羅尼迦前書","帖前","1TH",5],["帖撒羅尼迦後書","帖後","2TH",3],["提摩太前書","提前","1TI",6],["提摩太後書","提後","2TI",4],["提多書","多","TIT",3],["腓利門書","門","PHM",1],["希伯來書","來","HEB",13],["雅各書","雅","JAS",5],["彼得前書","彼前","1PE",5],["彼得後書","彼後","2PE",3],["約翰一書","約一","1JN",5],["約翰二書","約二","2JN",1],["約翰三書","約三","3JN",1],["猶大書","猶","JUD",1],["啟示錄","啟","REV",22]];let testament='old',selected=-1,chapter=1;
const el=id=>document.getElementById(id);const palette=['#8ea9a2','#97a9ae','#9da8b0','#a9a5ae','#9dad9c','#8ca3a4'];
function render(){el('books').replaceChildren();const q=el('search').value.trim().toLowerCase();books.forEach((b,i)=>{if((testament==='old'&&i>=39)||(testament==='new'&&i<39)||!(b[0]+b[1]+b[2]).toLowerCase().includes(q))return;const button=document.createElement('button');button.type='button';button.className='tile';button.style.background=palette[Math.floor(i/5)%palette.length];button.setAttribute('aria-label',b[0]+'，共'+b[3]+'章');button.innerHTML='<span class="top"><span>'+(i+1)+'</span><strong>'+b[2]+'</strong></span><span class="center">'+b[1]+'</span><span class="name">'+b[0]+'</span>';button.addEventListener('click',()=>openBook(i));el('books').append(button)})}
function openBook(i){selected=i;chapter=1;el('booktitle').textContent=books[i][0];el('meta').textContent=books[i][2]+' · '+books[i][3]+' 章';el('detail').classList.remove('hidden');showChapters();el('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function showChapters(){el('chapters').replaceChildren();for(let n=1;n<=books[selected][3];n++){const b=document.createElement('button');b.type='button';b.className='chapter'+(n===chapter?' active':'');b.textContent=n;b.setAttribute('aria-label','第'+n+'章');b.addEventListener('click',()=>{chapter=n;showChapters()});el('chapters').append(b)}const entry=el('entry');entry.replaceChildren();const title=document.createElement('h3');title.textContent=books[selected][0]+' 第 '+chapter+' 章';const p=document.createElement('p');p.className='muted';p.textContent='本章尚未發布讀經心得。日後可在此依日期收錄多篇心得。';entry.append(title,p)}
function choose(t){testament=t;selected=-1;el('detail').classList.add('hidden');el('old').classList.toggle('active',t==='old');el('new').classList.toggle('active',t==='new');render()}el('old').onclick=()=>choose('old');el('new').onclick=()=>choose('new');el('search').oninput=render;el('close').onclick=()=>{el('detail').classList.add('hidden');el('books').scrollIntoView({behavior:'smooth'})};render();
</script></body></html>
