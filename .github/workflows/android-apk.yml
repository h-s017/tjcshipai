name: Build Android colleague APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Bundle JavaScript inside installable APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'debuggableVariants = ["debug"]' in s:
              s=s.replace('debuggableVariants = ["debug"]','debuggableVariants = []')
          elif 'debuggableVariants = [\'debug\']' in s:
              s=s.replace("debuggableVariants = ['debug']",'debuggableVariants = []')
          else:
              s=s.replace('react {','react {\n    debuggableVariants = []',1)
          p.write_text(s)
          PY
      - name: Build debug APK for colleague testing
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-bible-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
