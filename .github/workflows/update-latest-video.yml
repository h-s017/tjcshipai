name: Update latest gathering video

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest YouTube video
        run: node scripts/update-latest-video.mjs > data/latest-video.json
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- data/latest-video.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-video.json
          git commit -m "Update latest gathering video"
          git push
