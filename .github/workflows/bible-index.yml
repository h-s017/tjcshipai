name: Update Bible reflection index
on:
  workflow_dispatch:
  schedule:
    - cron: '10 22 * * *'
permissions:
  contents: write
concurrency:
  group: bible-reflection-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch all Blogger pages
        run: python scripts/build_bible_index.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bible-posts.json data/shipai-monthly-audit.json data/shipai-discovered.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh complete Bible reflection archive index"
            git push
          fi
