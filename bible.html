n">新約 27 卷</button><input id="search" aria-label="搜尋經卷" placeholder="搜尋經卷、英文縮寫、章節或文章"></div><div id="category-legend" class="category-legend" aria-label="聖經經卷分類色彩說明"></div><section id="search-results" class="search-results" hidden aria-live="polite"></section><section id="books" class="grid" aria-label="聖經經卷元素表"></section><section id="detail" class="detail hidden" aria-live="polite"><button id="close" class="back" type="button">← 返回經卷</button><h2 id="booktitle"></h2><p id="meta" class="sub"></p><h3>選擇章節</h3><div id="chapters" class="chapters"></div><div class="reading-toolbar"><button id="prev" type="button">← 上一章</button><button id="share" class="share" type="button">分享本章 ↗</button><button id="next" type="button">下一章 →</button></div><div id="entry" class="entry"></div><div class="reading-toolbar"><button id="prev-bottom" type="button">← 上一章</button><button id="next-bottom" type="button">下一章 →</button></div></section><footer>真耶穌教會石牌教會 · 每日讀經心得</footer></main><script>

function categoryOf(i){return categories.find(c=>i>=c.start&&i<=c.end)}
function renderLegend(){const box=el('category-legend');box.replaceChildren();for(const c of categories.filter(c=>testament==='old'?c.end<39:c.start>=39)){const item=document.createElement('span');item.className='legend-item';const dot=document.createElement('span');dot.className='legend-dot';dot.style.backgroundColor=c.color;item.append(dot,document.createTextNode(c.name));box.append(item)}}
function setUrl(){const u=new URL(location.href);if(selected>=0){u.searchParams.set('book',books[selected][2]);u.searchParams.set('chapter',chapter);u.hash='detail'}else{u.searchParams.delete('book');u.searchParams.delete('chapter');u.hash=''}history.replaceState(null,'',u)}
function render(){el('books').replaceChildren();renderLegend();const q=el('search').value.trim().toLowerCase();books.forEach((b,i)=>{if((testament==='old'&&i>=39)||(testament==='new'&&i<39)||!(b[0]+b[1]+b[2]).toLowerCase().includes(q))return;const button=document.createElement('button');button.type='button';button.className='tile';const category=categoryOf(i);button.style.background=category.color;button.setAttribute('aria-label',b[0]+'，'+category.name+'，共'+b[3]+'章');button.innerHTML='<span class="top"><span>'+(i+1)+'</span><strong>'+b[2]+'</strong></span><span class="center">'+b[1]+'</span><span class="name">'+b[0]+'</span>';button.addEventListener('click',()=>openBook(i));el('books').append(button)})}
function openBook(i,ch=1,scroll=true){selected=i;chapter=ch;testament=i<39?'old':'new';el('old').classList.toggle('active',testament==='old');el('new').classList.toggle('active',testament==='new');el('booktitle').textContent=books[i][0];el('meta').textContent=books[i][2]+' · '+books[i][3]+' 章';el('detail').classList.remove('hidden');setUrl();showChapters();if(scroll)el('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function moveChapter(delta){if(selected<0)return;let i=selected,n=chapter+delta;if(n<1){if(i===0)return;i--;n=books[i][3]}else if(n>books[i][3]){if(i===books.length-1)return;i++;n=1}if(i!==selected){openBook(i,n,false)}else{chapter=n;setUrl();showChapters()}el('entry').scrollIntoView({behavior:'smooth',block:'start'})}
function showChapters(){el('chapters').replaceChildren();for(let n=1;n<=books[selected][3];n++){const b=document.createElement('button');b.type='button';b.className='chapter'+(n===chapter?' active':'');b.textContent=n;b.setAttribute('aria-label','第'+n+'章');b.setAttribute('aria-current',n===chapter?'true':'false');b.addEventListener('click',()=>{chapter=n;setUrl();showChapters();el('entry').scrollIntoView({behavior:'smooth',block:'start'})});el('chapters').append(b)}const prev=selected===0&&chapter===1,next=selected===books.length-1&&chapter===books[selected][3];['prev','prev-bottom'].forEach(id=>el(id).disabled=prev);['next','next-bottom'].forEach(id=>el(id).disabled=next);const entry=el('entry');entry.replaceChildren();const title=document.createElement('h3');title.textContent=books[selected][0]+' 第 '+chapter+' 章';const p=document.createElement('p');p.className='muted';p.textContent='正在載入讀經心得…';entry.append(p);renderMatches()}
function choose(t){testament=t;selected=-1;setUrl();el('detail').classList.add('hidden');el('old').classList.toggle('active',t==='old');el('new').classList.toggle('active',t==='new');render()}
el('old').onclick=()=>choose('old');el('new').onclick=()=>choose('new');el('search').oninput=()=>{render();clearTimeout(searchTimer);searchTimer=setTimeout(searchAll,180)};el('close').onclick=()=>{selected=-1;setUrl();el('detail').classList.add('hidden');el('books').scrollIntoView({behavior:'smooth'})};['prev','prev-bottom'].forEach(id=>el(id).onclick=()=>moveChapter(-1));['next','next-bottom'].forEach(id=>el(id).onclick=()=>moveChapter(1));el('share').onclick=async()=>{setUrl();const url=location.href;try{if(navigator.share)await navigator.share({title:books[selected][0]+' 第'+chapter+'章讀經心得',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);el('share').textContent='已複製連結 ✓';setTimeout(()=>el('share').textContent='分享本章 ↗',1800)}else prompt('複製本章連結',url)}catch(e){if(e.name!=='AbortError')prompt('複製本章連結',url)}};

function searchReference(q){const t=q.replace(/\s+/g,'').replace(/第/g,'').replace(/章$/,'').toUpperCase();for(const [i,a] of aliases.entries()){for(const name of [a[1],a[0],books[i][2]]){if(!t.startsWith(name))continue;const suffix=t.slice(name.length).replace(/^[:：]/,'');if(!suffix)continue;const n=numberOf(suffix);if(Number.isInteger(n)&&n>0&&n<=books[i][3])return {i,ch:n}}}return null}
async function searchAll(){const q=el('search').value.trim();const box=el('search-results');box.replaceChildren();if(!q){box.hidden=true;return}box.hidden=false;const ref=searchReference(q);if(ref){const b=document.createElement('button');b.className='search-hit';b.textContent=books[ref.i][0]+' 第 '+ref.ch+' 章 →';b.onclick=()=>openBook(ref.i,ref.ch);box.append(b)}const archive=await loadArchive();if(q!==el('search').value.trim())return;if(!archive)return;const hits=archive.filter(p=>p.title.includes(q)).slice(0,35);if(hits.length){const heading=document.createElement('h3');heading.className='result-title';heading.textContent='文章標題搜尋結果'+(hits.length===35?'（顯示前 35 筆）':'');box.append(heading);for(const p of hits){const a=document.createElement('a');a.className='article-card';a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';const src=document.createElement('span');src.className='source';src.textContent=p.source==='石牌・天母每日讀經心得'?'真耶穌教會石牌天母每日讀經心得':p.source;const title=document.createElement('strong');title.className='article-title';title.textContent=p.title;const date=document.createElement('span');date.className='date';date.textContent=p.date||'';a.append(src,title,date);box.append(a)}}if(!box.children.length){const p=document.createElement('p');p.className='muted';p.textContent='沒有符合的章節或文章標題';box.append(p)}}
function restoreLink(){const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1)),id=params.get('book')||hash.get('book'),raw=params.get('chapter')||hash.get('chapter')||(params.get('book')||'').match(/chapter=(\d+)/)?.[1],n=Number(raw);const i=books.findIndex(b=>b[2]===id);if(i>=0&&Number.isInteger(n)&&n>=1&&n<=books[i][3]){openBook(i,n,false);requestAnimationFrame(()=>{el('detail').scrollIntoView({block:'start'});setTimeout(()=>el('entry').scrollIntoView({block:'start'}),300)})}}

const cn={'〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'百':100,'廿':20,'卅':30,'兩':2};
function numberOf(s){if(/^[零〇一二三四五六七八九]+$/.test(s))return Number([...s].map(c=>({'零':0,'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9})[c]).join(''));if(/^\d+$/.test(s))return Number(s);const digits={'零':0,'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'壹':1,'貳':2,'參':3,'肆':4,'伍':5,'陸':6,'柒':7,'捌':8,'玖':9};let total=0,part=0;for(const c of s){if(c==='百'||c==='佰'){total+=(part||1)*100;part=0}else if(c==='十'||c==='拾'){total+=(part||1)*10;part=0}else if(c==='廿'){total+=20;part=0}else if(c==='卅'){total+=30;part=0}else if(c in digits){part=digits[c]}else return NaN}return total+part}

function identify(title){
 const firstChapterOverrides={"利未記導讀":2,"雖然知道，仍要提醒（猶）":64,"路加福音概論":41,"對弟兄幸災樂禍的以東人（俄）":30,"耶利米書簡介":23,"民數記文集(1-36)":3,"申命記文集（1-34)":4,"出埃及記文集（16-40章）":1,"利未記文集(1-27)":2};
 if(Object.prototype.hasOwnProperty.call(firstChapterOverrides,title))return {i:firstChapterOverrides[title],ch:1};
 if(title.includes('誰像耶和華')&&title.includes('彌迦書大要'))return {i:32,ch:1};

function loadSource(source){if(cache[source.base])return cache[source.base];cache[source.base]=new Promise(resolve=>{const cb='bibleFeed'+Math.random().toString(36).slice(2);const script=document.createElement('script');let done=false;const finish=(data)=>{if(done)return;done=true;delete window[cb];script.remove();resolve(data)};window[cb]=data=>{const entries=(data.feed&&data.feed.entry||[]).map(e=>({title:e.title.$t,url:(e.link||[]).find(l=>l.rel==='alternate')?.href,date:e.published?.$t?.slice(0,10),match:identify(e.title.$t)})).filter(e=>e.url);finish(entries)};script.onerror=()=>finish([]);script.src=source.base+'/feeds/posts/default?alt=json-in-script&max-results=150&callback='+cb;document.head.append(script);setTimeout(()=>finish([]),12000)});return cache[source.base]}
async function renderMatches(){
  const i=selected,ch=chapter,entry=el('entry');
  const archive=await loadArchive();
  const results=archive?sources.map(s=>archive.filter(p=>p.source===s.name)):await Promise.all(sources.map(loadSource));
  if(i!==selected||ch!==chapter)return;
  entry.replaceChildren();
  const title=document.createElement('h3');
  title.textContent=books[i][0]+' 第 '+ch+' 章';
  const hits=results.flatMap(posts=>posts.filter(p=>p.match&&p.match.i===i&&p.match.ch===ch));
  hits.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(a.title||'').localeCompare(b.title||''));
  for(const post of hits){
    const link=document.createElement('a');
    link.className='article-card';
    link.href=post.url;
    link.target='_blank';
    link.rel='noopener noreferrer';
    const source=document.createElement('span');
    source.className='source';
    source.textContent=post.source==='石牌・天母每日讀經心得'?'真耶穌教會石牌天母每日讀經心得':(post.source||'讀經心得');
    const name=document.createElement('strong');
    name.className='article-title';
    name.textContent=post.title;
    const date=document.createElement('span');
    date.className='date';
    date.textContent=post.date||'';
    const read=document.createElement('span');
    read.className='read';
    read.textContent='閱讀文章 ↗';
    link.append(source,name,date,read);
    entry.append(link);
  }
  if(!hits.length){
    const p=document.createElement('p');
    p.className='muted';
    p.textContent='目前尚無符合本章的心得文章。';
    entry.append(p);
  }
}
