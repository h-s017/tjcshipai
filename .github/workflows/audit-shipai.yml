name: Audit Shipai Blogger archive by month
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/*bible*', 'scripts/*shipai*', 'scripts/blogger_archive.py', 'data/bible-posts.json', 'bible.html']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/audit_shipai_months.py
      - run: python scripts/test_blogger_archive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipai-monthly-audit
          path: |
            data/shipai-monthly-audit.json
            data/shipai-discovered.json
