backend:
  name: github
  repo: h-s017/tjcshipai
  branch: main
  open_authoring: false

publish_mode: editorial_workflow
locale: "zh_Hant"


media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: "https://h-s017.github.io/tjcshipai/"
display_url: "https://h-s017.github.io/tjcshipai/"
logo_url: "https://h-s017.github.io/tjcshipai/"

collections:
  - name: "site_data"
    label: "網站資料"
    files:
      - label: "最新消息"
        name: "news"
        file: "data/news.json"
        format: "json"
        fields:
          - label: "更新日期"
            name: "updatedAt"
            widget: "string"
          - label: "消息列表"
            name: "items"
            widget: "list"
            fields:
              - { label: "日期／標籤", name: "date", widget: "string" }
              - { label: "標題", name: "title", widget: "string" }
              - { label: "摘要", name: "excerpt", widget: "text" }
              - { label: "連結", name: "url", widget: "string" }

      - label: "教會沿革"
        name: "history"
        file: "data/history.json"
        format: "json"
        fields:
          - { label: "頁面標題", name: "pageTitle", widget: "string" }
          - { label: "更新日期", name: "updatedAt", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
          - { label: "頁面導言", name: "intro", widget: "text" }
          - { label: "沿革內文", name: "content", widget: "markdown" }

      - label: "生命見證"
        name: "testimonies"
        file: "data/testimonies.json"
        format: "json"
        fields:
          - { label: "頁面標題", name: "pageTitle", widget: "string" }
          - { label: "Facebook 社團", name: "sourceUrl", widget: "string" }
          - { label: "Facebook 粉專", name: "facebookPageUrl", widget: "string" }
          - { label: "更新日期", name: "updatedAt", widget: "string" }
          - { label: "頁面導言", name: "intro", widget: "text" }
          - label: "見證文章"
            name: "items"
            widget: "list"
            fields:
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "標題", name: "title", widget: "string" }
              - { label: "作者中文全名", name: "author", widget: "string", pattern: ["^[一-龥]+$", "請只輸入中文全名"] }
              - { label: "摘要", name: "excerpt", widget: "text" }
              - { label: "內文", name: "content", widget: "text" }
              - { label: "來源連結", name: "sourceUrl", widget: "string", required: false }
