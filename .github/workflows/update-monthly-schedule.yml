name: Update monthly schedule

on:
  schedule:
    # 00:15 UTC on day 1 = 08:15 Asia/Taipei on day 1.
    - cron: '15 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-monthly-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve current month worksheet
        run: python scripts/update_schedule.py

      - name: Commit updated schedule metadata
        shell: bash
        run: |
          if git diff --quiet -- data/current-schedule.json; then
            echo "No schedule metadata change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-schedule.json
          git commit -m "Update schedule for $(TZ=Asia/Taipei date +'%Y-%m')"
          git push
