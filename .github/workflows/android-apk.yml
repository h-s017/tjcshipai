name: Build Android colleague APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate PNG app icons from approved book artwork
        run: |
          python3 -m pip install --quiet cairosvg
          mkdir -p assets
          python3 - <<'PY'
          import cairosvg
          from pathlib import Path
          svg=Path('../assets/bible-app-icon.svg').read_bytes()
          cairosvg.svg2png(bytestring=svg,write_to='assets/bible-app-icon.png',output_width=1024,output_height=1024)
          cairosvg.svg2png(bytestring=svg,write_to='../assets/bible-app-icon-192.png',output_width=192,output_height=192)
          cairosvg.svg2png(bytestring=svg,write_to='../assets/bible-app-icon-512.png',output_width=512,output_height=512)
          PY
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Bundle JavaScript inside installable APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'debuggableVariants = ["debug"]' in s:
              s=s.replace('debuggableVariants = ["debug"]','debuggableVariants = []')
          elif 'debuggableVariants = [\'debug\']' in s:
              s=s.replace("debuggableVariants = ['debug']",'debuggableVariants = []')
          else:
              s=s.replace('react {','react {\n    debuggableVariants = []',1)
          p.write_text(s)
          PY
      - name: Build debug APK for colleague testing
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Commit generated icon assets
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/bible-app-icon.png assets/bible-app-icon-192.png assets/bible-app-icon-512.png
          git diff --cached --quiet || (git commit -m 'Add book PNG icons [skip ci]' && git push)
        working-directory: .
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-bible-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
