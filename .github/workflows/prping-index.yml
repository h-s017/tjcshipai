name: Update 牧養主的羊 Bible reflections
on:
  workflow_dispatch:
  schedule:
    - cron: '10 22,4 * * *'
permissions:
  contents: write
concurrency:
  group: bible-reflection-index
  cancel-in-progress: false
jobs:
  update-prping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect all public Blogger posts
        run: python scripts/update_prping.py
      - name: Commit index and source report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bible-posts.json data/prping-index-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh 牧養主的羊 Bible reflections"
            git pull --rebase
            git push
          fi
